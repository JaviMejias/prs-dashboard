name: pr-control-room-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pr_control_room
      POSTGRES_USER: pr_control_room
      POSTGRES_PASSWORD: prcr_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pr_control_room_dev_postgres_data:/var/lib/postgresql/data
    networks:
      - pr-control-room-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr_control_room -d pr_control_room"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - server/.env.development
    environment:
      DATABASE_URL: postgresql://pr_control_room:prcr_dev_password@postgres:5432/pr_control_room
      FRONTEND_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
    command: ["node", "dist/server.js"]
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pr-control-room-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pr-control-room-network

volumes:
  pr_control_room_dev_postgres_data:

networks:
  pr-control-room-network:
    name: pr-control-room-dev-network
